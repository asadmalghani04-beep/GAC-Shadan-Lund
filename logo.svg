<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="50%" stop-color="#e8bf53"/>
      <stop offset="100%" stop-color="#ab7c0e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a36"/>
      <stop offset="100%" stop-color="#00331f"/>
    </linearGradient>
    <path id="textCircleTop" d="M 28,100 A 72,72 0 1,1 172,100" />
    <path id="textCircleBottom" d="M 172,100 A 72,72 0 0,1 28,100" />
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="100" cy="100" r="97" fill="url(#goldGrad)" stroke="#664600" stroke-width="2"/>
  <circle cx="100" cy="100" r="92" fill="url(#emeraldGrad)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Outer Ring Text -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#fff5d6" letter-spacing="2.2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      GOVT. ASSOCIATE COLLEGE
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff5d6" letter-spacing="3.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      SHADAN LUND (PUNJAB)
    </textPath>
  </text>

  <!-- Inner Gold Bezel -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="61" fill="#004429"/>

  <!-- Crescent and Star -->
  <path d="M 100,52 A 26,26 0 1,0 120,86 A 21,21 0 1,1 100,52 Z" fill="url(#goldGrad)" />
  <polygon points="122,64 125,72 133,72 127,77 129,85 122,80 115,85 117,77 111,72 119,72" fill="url(#goldGrad)" />

  <!-- Open Book Emblem -->
  <g transform="translate(100, 114) scale(0.95)">
    <!-- Book Pages Base -->
    <path d="M 0,-4 Q -22,-14 -44,-8 L -44,18 Q -22,12 0,22 Q 22,12 44,18 L 44,-8 Q 22,-14 0,-4 Z" fill="#ffffff" stroke="#c49c2f" stroke-width="1.5"/>
    <!-- Page lines -->
    <path d="M 0,-4 L 0,22" stroke="#ab7c0e" stroke-width="2"/>
    <path d="M -8,2 Q -22,-4 -36,-1" stroke="#004429" stroke-width="1.2" fill="none"/>
    <path d="M -8,7 Q -22,1 -36,4" stroke="#004429" stroke-width="1.2" fill="none"/>
    <path d="M -8,12 Q -22,6 -36,9" stroke="#004429" stroke-width="1.2" fill="none"/>
    <path d="M 8,2 Q 22,-4 36,-1" stroke="#004429" stroke-width="1.2" fill="none"/>
    <path d="M 8,7 Q 22,1 36,4" stroke="#004429" stroke-width="1.2" fill="none"/>
    <path d="M 8,12 Q 22,6 36,9" stroke="#004429" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Urdu Motto Banner -->
  <g transform="translate(100, 148)">
    <rect x="-42" y="-10" width="84" height="18" rx="9" fill="url(#goldGrad)" stroke="#664600" stroke-width="1"/>
    <text x="0" y="3.5" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#00331f" text-anchor="middle">
      ربِّ زِدْنِیْ عِلْماً
    </text>
  </g>

  <!-- Side Stars -->
  <polygon points="26,100 28,104 33,104 29,107 30,111 26,108 22,111 23,107 19,104 24,104" fill="url(#goldGrad)"/>
  <polygon points="174,100 176,104 181,104 177,107 178,111 174,108 170,111 171,107 167,104 172,104" fill="url(#goldGrad)"/>
</svg>
